name: Build

# Сборка на каждый push и pull request: готовые файлы - во вкладке Actions -> нужный запуск -> Artifacts.
# Релиз выходит сам:
#   - push в ветку release - версия берётся из server/Version.h (тег ModGear-vX.Y.Z);
#   - или push тега ModGear-vX.Y.Z.
# Если релиз с этой версией уже есть - в нём обновляются только архивы (описание не трогается).

on:
  push:
    branches: ['**']
    tags: ['ModGear-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.edition }} ${{ matrix.platform }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        platform: [samp, omp]
        edition: [full, alfa]
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.platform == 'omp' && 'recursive' || 'false' }}

      - name: Install packages
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DMODGEAR_PLATFORM=${{ matrix.platform }} -DMODGEAR_EDITION=${{ matrix.edition }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Linux)
        if: matrix.os == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DMODGEAR_PLATFORM=${{ matrix.platform }} -DMODGEAR_EDITION=${{ matrix.edition }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build/server -maxdepth 2 \( -name 'ModGear*.dll' -o -name 'ModGear*.so' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ matrix.platform }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  package:
    name: Package
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack
        run: bash tools/pack_release.sh artifacts dist

      - uses: actions/upload-artifact@v4
        with:
          name: ModGear-release
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/ModGear-v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          get() { sed -nE "s/^#define $1 ([0-9]+).*/\1/p" server/Version.h; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="ModGear-v$(get MODGEAR_VERSION_MAJOR).$(get MODGEAR_VERSION_MINOR).$(get MODGEAR_VERSION_PATCH)"
          fi
          alfa="$(get MODGEAR_ALFA_VERSION_MAJOR).$(get MODGEAR_ALFA_VERSION_MINOR).$(get MODGEAR_ALFA_VERSION_PATCH)"
          {
            echo "ModGear ${tag#ModGear-v} (ModGearAlfa $alfa)"
            echo
            echo "| Файл | Что это |"
            echo "|---|---|"
            echo "| \`ModGear-TestServer.zip\` | готовый тестовый сервер SA-MP с плагином и модом: распаковать и запустить \`start.bat\` |"
            echo "| \`ModGear-includes.zip\` | все include для Pawn и документация |"
            echo "| \`ModGear-SAMP.dll\` / \`.so\` | плагин для SA-MP 0.3.7 (Windows / Linux) - в папку \`plugins\` |"
            echo "| \`ModGear-openmp.dll\` / \`.so\` | компонент для open.mp (Windows / Linux) - в папку \`components\` |"
            echo "| \`ModGearAlfa-*\` | облегчённая редакция |"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "ModGear ${tag#ModGear-v}" --notes-file notes.md dist/*
          fi
