name: Build

# Сборка на каждый push и pull request: готовые файлы - во вкладке Actions -> нужный запуск -> Artifacts.
# Релиз: запушить тег вида v0.7.0 (git tag v0.7.0 && git push origin v0.7.0) -
# соберутся все версии и выйдет релиз с архивами.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.edition }} ${{ matrix.platform }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        platform: [samp, omp]
        edition: [full, alfa]
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.platform == 'omp' && 'recursive' || 'false' }}

      - name: Install packages
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DMODGEAR_PLATFORM=${{ matrix.platform }} -DMODGEAR_EDITION=${{ matrix.edition }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Linux)
        if: matrix.os == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DMODGEAR_PLATFORM=${{ matrix.platform }} -DMODGEAR_EDITION=${{ matrix.edition }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build/server -maxdepth 2 \( -name 'ModGear*.dll' -o -name 'ModGear*.so' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ matrix.platform }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack
        run: bash tools/pack_release.sh artifacts dist

      - uses: actions/upload-artifact@v4
        with:
          name: ModGear-release
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          get() { sed -nE "s/^#define $1 ([0-9]+).*/\1/p" server/Version.h; }
          alfa="$(get MODGEAR_ALFA_VERSION_MAJOR).$(get MODGEAR_ALFA_VERSION_MINOR).$(get MODGEAR_ALFA_VERSION_PATCH)"
          {
            echo "ModGear ${tag#v} (ModGearAlfa $alfa)"
            echo
            echo "| Файл | Что внутри |"
            echo "|---|---|"
            echo "| \`ModGear-SAMP.zip\` | плагин для SA-MP 0.3.7 (Windows + Linux) и include |"
            echo "| \`ModGear-openmp.zip\` | компонент для open.mp (Windows + Linux) и include |"
            echo "| \`ModGearAlfa-*.zip\` | облегчённая редакция |"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" --title "ModGear ${tag#v}" --notes-file notes.md dist/*.zip
          fi
