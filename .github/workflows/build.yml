name: Build

# Сборка на каждый push и pull request: готовые файлы - во вкладке Actions -> нужный запуск -> Artifacts.
# Релизы выходят сами при push в ветку release - отдельно ModGear и ModGearAlfa,
# версии берутся из server/Version.h (теги ModGear-vX.Y.Z и ModGearAlfa-vX.Y.Z).
# Если релиз с этой версией уже есть - в нём обновляются только файлы (описание не трогается).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.edition }} ${{ matrix.platform }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        platform: [samp, omp]
        edition: [full, alfa]
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.platform == 'omp' && 'recursive' || 'false' }}

      - name: Install packages
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DMODGEAR_PLATFORM=${{ matrix.platform }} -DMODGEAR_EDITION=${{ matrix.edition }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Linux)
        if: matrix.os == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DMODGEAR_PLATFORM=${{ matrix.platform }} -DMODGEAR_EDITION=${{ matrix.edition }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build/server -maxdepth 2 \( -name 'ModGear*.dll' -o -name 'ModGear*.so' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ matrix.platform }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  package:
    name: Package
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack
        run: bash tools/pack_release.sh artifacts dist

      - uses: actions/upload-artifact@v4
        with:
          name: ModGear-release
          path: dist/ModGear/*

      - uses: actions/upload-artifact@v4
        with:
          name: ModGearAlfa-release
          path: dist/ModGearAlfa/*

      - name: Release
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          get() { sed -nE "s/^#define $1 ([0-9]+).*/\1/p" server/Version.h; }
          release() { # release <имя> <версия> <описание редакции>
            local name=$1 version=$2 about=$3 tag="$1-v$2"
            {
              echo "$name $version - $about"
              echo
              echo "| Файл | Что это |"
              echo "|---|---|"
              echo "| \`$name-SAMP.zip\` | плагин для SA-MP 0.3.7: \`plugins/$name.dll\` (Windows) и \`.so\` (Linux) |"
              echo "| \`$name-openmp.zip\` | компонент для open.mp: \`components/$name.dll\` (Windows) и \`.so\` (Linux) |"
              echo "| \`$name-includes.zip\` | include для Pawn и документация |"
              echo "| \`$name-TestServer-SAMP.zip\` | готовый тестовый сервер SA-MP с плагином и модом: распаковать и запустить \`start.bat\` |"
              echo "| \`$name-TestServer-openmp.zip\` | готовый тестовый сервер open.mp с плагином и модом: распаковать и запустить \`start.bat\` |"
              echo
              echo "Документация: https://painfrenemy2.github.io/ModGear/"
            } > notes-$name.md
            if gh release view "$tag" >/dev/null 2>&1; then
              for old in $(gh release view "$tag" --json assets -q '.assets[].name'); do
                [ -f "dist/$name/$old" ] || gh release delete-asset "$tag" "$old" -y
              done
              gh release upload "$tag" dist/$name/* --clobber
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$name $version" --notes-file notes-$name.md dist/$name/*
            fi
          }
          full="$(get MODGEAR_VERSION_MAJOR).$(get MODGEAR_VERSION_MINOR).$(get MODGEAR_VERSION_PATCH)"
          alfa="$(get MODGEAR_ALFA_VERSION_MAJOR).$(get MODGEAR_ALFA_VERSION_MINOR).$(get MODGEAR_ALFA_VERSION_PATCH)"
          release ModGearAlfa "$alfa" "облегчённая редакция: замена моделей, скинов и иконок, цвет машин, статус лаунчера"
          release ModGear "$full" "полная версия"
          gh release edit "ModGear-v$full" --latest
